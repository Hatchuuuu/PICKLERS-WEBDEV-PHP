ServerName localhost
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php

    <Directory /var/www/html/public>
        Options -Indexes -Includes -ExecCGI
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/public/uploads>
        AllowOverride None
        php_admin_flag engine off
        <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|pht|inc|cgi|pl|py|sh|exe|bat|cmd|ps1)$">
            Require all denied
        </FilesMatch>
    </Directory>

    <Directory /var/www/html/public/uploads/permits>
        Require all denied
    </Directory>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
