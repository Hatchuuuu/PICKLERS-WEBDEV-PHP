name: Verify

on: [push, pull_request]

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify application in isolated containers
        run: docker compose --env-file .env.docker.example --profile test run --build --rm test
      - name: Start production image
        run: docker compose --env-file .env.docker.example up --build --wait app
      - name: Check Apache HTTP boundaries
        run: docker compose --env-file .env.docker.example --profile test run --no-deps --rm test php scripts/docker-smoke.php http://app:8080
      - name: Show container logs on failure
        if: failure()
        run: docker compose --env-file .env.docker.example --profile test logs --tail=100
      - name: Stop containers
        if: always()
        run: docker compose --env-file .env.docker.example --profile test down
